<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>搶票資訊登記</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      background-color: #f4f6f8;
      margin: 0;
      padding: 16px 12px;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .card {
      background: #ffffff;
      width: 100%;
      max-width: 480px;
      border-radius: 16px;
      padding: 24px 20px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
      height: fit-content;
      margin: auto;
    }

    h2 {
      color: #1DB954;
      margin: 0 0 16px 0;
      font-size: 20px;
      text-align: center;
    }

    /* 頁籤導覽 */
    .tabs {
      display: flex;
      border-bottom: 2px solid #e1e4e8;
      margin-bottom: 18px;
    }

    .tab-btn {
      flex: 1;
      padding: 10px;
      text-align: center;
      background: none;
      border: none;
      font-size: 15px;
      font-weight: 600;
      color: #666;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      margin-bottom: -2px;
    }

    .tab-btn.active {
      color: #06C755;
      border-bottom-color: #06C755;
    }

    /* 區塊標題 */
    .section-divider {
      font-size: 13px;
      font-weight: 700;
      color: #06C755;
      margin: 16px 0 10px 0;
      padding-bottom: 4px;
      border-bottom: 2px solid #e8f7ed;
    }

    .form-group {
      margin-bottom: 12px;
    }

    label {
      font-weight: 600;
      display: block;
      margin-bottom: 4px;
      font-size: 14px;
      color: #333;
    }

    .required {
      color: red;
    }

    input {
      width: 100%;
      height: 42px;
      padding: 8px 12px;
      border: 1.5px solid #ccc;
      border-radius: 8px;
      box-sizing: border-box;
      font-size: 14px;
      background: #fafafa;
      outline: none;
      transition: all 0.2s;
    }

    input:focus {
      border-color: #06C755;
      background: #fff;
      box-shadow: 0 0 0 3px rgba(6, 199, 85, 0.15);
    }

    .primary-btn {
      width: 100%;
      height: 46px;
      background: #06C755;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 16px;
      box-shadow: 0 4px 12px rgba(6, 199, 85, 0.25);
    }

    .primary-btn:disabled {
      background: #ccc;
      box-shadow: none;
      cursor: not-allowed;
    }

    /* 列表頁樣式 */
    .filter-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
    }

    .filter-btn {
      flex: 1;
      padding: 6px 12px;
      font-size: 13px;
      border-radius: 20px;
      border: 1px solid #ddd;
      background: #fff;
      cursor: pointer;
    }

    .filter-btn.active {
      background: #e8f7ed;
      border-color: #06C755;
      color: #06C755;
      font-weight: bold;
    }

    .item-card {
      border: 1px solid #e1e4e8;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 12px;
      background: #fafafa;
    }

    .item-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }

    .item-title {
      font-weight: bold;
      font-size: 16px;
      color: #111;
    }

    .item-badge {
      font-size: 12px;
      padding: 2px 8px;
      border-radius: 10px;
      font-weight: bold;
    }

    .badge-active {
      background: #e8f7ed;
      color: #06C755;
    }

    .badge-expired {
      background: #eeeeee;
      color: #888888;
    }

    .item-body {
      font-size: 13px;
      color: #555;
      line-height: 1.6;
    }

    .item-timestamps {
      font-size: 11px;
      color: #999;
      margin-top: 8px;
      border-top: 1px dashed #e1e4e8;
      padding-top: 6px;
    }

    .item-actions {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }

    .action-btn {
      flex: 1;
      padding: 8px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: bold;
      border: none;
      cursor: pointer;
    }

    .edit-btn {
      background: #f0f2f5;
      color: #333;
      border: 1px solid #ccc;
    }

    .delete-btn {
      background: #ffebeb;
      color: #d93025;
    }

    .empty-msg {
      text-align: center;
      color: #999;
      padding: 30px 0;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>🎫 搶票資訊登記</h2>

    <!-- 頁籤選單 -->
    <div class="tabs">
      <button class="tab-btn active" id="tabRegister" onclick="switchView('register')">新增 / 編輯登記</button>
      <button class="tab-btn" id="tabList" onclick="switchView('list')">行程清單</button>
    </div>

    <!-- 表單 View -->
    <div id="viewRegister">
      <form id="ticketForm">
        <input type="hidden" id="editEventId" value="">
        <div class="section-divider">📌 必填欄位</div>
        <div class="form-group"><label>姓名 <span class="required">*</span></label><input type="text" id="name" placeholder="例如：張小明" required></div>
        <div class="form-group"><label>售票日期 <span class="required">*</span></label><input type="date" id="ticketDate" required></div>
        <div class="form-group"><label>售票時間 <span class="required">*</span></label><input type="time" id="ticketTime" required></div>
        <div class="form-group"><label>售票連結 <span class="required">*</span></label><input type="url" id="ticketLink" placeholder="https://..." required></div>
        <div class="form-group"><label>訂購張數 <span class="required">*</span></label><input type="number" id="ticketCount" placeholder="2" min="1" required></div>
        <div class="form-group"><label>平台帳號 <span class="required">*</span></label><input type="text" id="account" placeholder="電子郵件、身分證、電話...等" required></div>
        <div class="form-group"><label>平台密碼 <span class="required">*</span></label><input type="text" id="password" placeholder="登入密碼" required></div>

        <div class="section-divider">✏️ 選填欄位</div>
        <div class="form-group"><label>演出日期 (選填)</label><input type="date" id="eventDate"></div>
        <div class="form-group"><label>票價區域 (選填)</label><input type="text" id="ticketArea" placeholder="例如：A區 4800"></div>
        <div class="form-group"><label>優先購票 (選填)</label><input type="text" id="priorityCode" placeholder="信用卡前N碼、會員代碼..."></div>

        <button type="button" id="submitBtn" class="primary-btn" onclick="submitData()">送出表單</button>
      </form>
    </div>

    <!-- 列表 View -->
    <div id="viewList" style="display: none;">
      <div class="filter-tabs">
        <button class="filter-btn active" id="btnActiveList" onclick="filterList('active')">進行中 (未過期)</button>
        <button class="filter-btn" id="btnExpiredList" onclick="filterList('expired')">歷史紀錄 (已過期)</button>
      </div>
      <div id="loadingText" style="text-align:center; padding: 20px; color:#888;">載入中...</div>
      <div id="listContainer"></div>
    </div>
  </div>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script>
    const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwbjjKVDfgjqGNmlbK30tfe-7ybMTYNyJ6820IDMM-CSgjIIY4yx8FckBpjzF1sH7Ac/exec";
    const LIFF_ID = "2010930705-qUp1Ao2b";
    let allEvents = [];
    let currentFilter = 'active';

    window.onload = async function() {
      try {
        await liff.init({ liffId: LIFF_ID });
        const params = new URLSearchParams(window.location.search);
        if (params.get("mode") === "list") {
          switchView('list');
        }
      } catch (err) {
        console.error("LIFF 初始化失敗：", err);
      }
    };

    function switchView(view) {
      if (view === 'register') {
        document.getElementById('viewRegister').style.display = 'block';
        document.getElementById('viewList').style.display = 'none';
        document.getElementById('tabRegister').classList.add('active');
        document.getElementById('tabList').classList.remove('active');
      } else {
        document.getElementById('viewRegister').style.display = 'none';
        document.getElementById('viewList').style.display = 'block';
        document.getElementById('tabRegister').classList.remove('active');
        document.getElementById('tabList').classList.add('active');
        fetchEventList();
      }
    }

    async function getUserId() {
      if (liff.isLoggedIn()) {
        const p = await liff.getProfile();
        return p.userId;
      }
      return "";
    }

    async function submitData() {
      const name = document.getElementById('name').value.trim();
      const ticketDate = document.getElementById('ticketDate').value;
      const ticketTime = document.getElementById('ticketTime').value;
      const ticketLink = document.getElementById('ticketLink').value.trim();
      const ticketCount = document.getElementById('ticketCount').value;
      const account = document.getElementById('account').value.trim();
      const password = document.getElementById('password').value.trim();

      if (!name || !ticketDate || !ticketTime || !ticketLink || !ticketCount || !account || !password) {
        alert("請確保所有【必填欄位】均已正確填寫！");
        return;
      }

      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.innerText = "處理中...";

      let userId = "";
      try {
        userId = await getUserId();
      } catch (e) {
        console.warn("無法取得 Profile", e);
      }

      const editEventId = document.getElementById('editEventId').value;
      const payload = {
        action: "submit_form",
        userId: userId,
        editEventId: editEventId,
        name: name,
        ticketDate: ticketDate,
        ticketTime: ticketTime,
        ticketLink: ticketLink,
        ticketCount: ticketCount,
        account: account,
        password: password,
        eventDate: document.getElementById('eventDate').value || "未指定",
        ticketArea: document.getElementById('ticketArea').value.trim() || "未指定",
        priorityCode: document.getElementById('priorityCode').value.trim() || "無"
      };

      try {
        // 先送出暫存至 GAS
        await fetch(GAS_WEB_APP_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        // LIFF 發送訊息觸發 Webhook
        if (liff.isInClient()) {
          await liff.sendMessages([
            {
              type: "text",
              text: "核對資料"
            }
          ]);
          liff.closeWindow();
        } else {
          alert("已送出！請到 LINE 聊天室確認。");
          btn.disabled = false;
          btn.innerText = "送出表單";
        }
      } catch (err) {
        alert("送出失敗：" + err.message);
        btn.disabled = false;
        btn.innerText = "重新送出";
      }
    }

    async function fetchEventList() {
      const userId = await getUserId();
      document.getElementById('loadingText').style.display = 'block';
      document.getElementById('listContainer').innerHTML = '';

      try {
        const resp = await fetch(`${GAS_WEB_APP_URL}?action=get_events&userId=${userId}`);
        allEvents = await resp.json();
        document.getElementById('loadingText').style.display = 'none';
        renderList();
      } catch (e) {
        document.getElementById('loadingText').innerText = "載入失敗，請稍後重試。";
      }
    }

    function filterList(type) {
      currentFilter = type;
      document.getElementById('btnActiveList').classList.toggle('active', type === 'active');
      document.getElementById('btnExpiredList').classList.toggle('active', type === 'expired');
      renderList();
    }

    function renderList() {
      const container = document.getElementById('listContainer');
      container.innerHTML = '';
      const now = new Date().getTime();

      const filtered = allEvents.filter(ev => {
        const evTime = new Date(`${ev.ticketDate}T${ev.ticketTime}:00`).getTime();
        return currentFilter === 'active' ? evTime >= now : evTime < now;
      });

      if (filtered.length === 0) {
        container.innerHTML = `<div class="empty-msg">查無${currentFilter === 'active' ? '進行中' : '歷史'}行程</div>`;
        return;
      }

      filtered.forEach(ev => {
        const evTime = new Date(`${ev.ticketDate}T${ev.ticketTime}:00`).getTime();
        const isExpired = evTime < now;
        const item = document.createElement('div');
        item.className = 'item-card';
        item.innerHTML = `
          <div class="item-header">
            <span class="item-title">${ev.name}</span>
            <span class="item-badge ${isExpired ? 'badge-expired' : 'badge-active'}">${isExpired ? '已過期' : '進行中'}</span>
          </div>
          <div class="item-body">
            <div>⏰ 售票：${ev.ticketDate} ${ev.ticketTime}</div>
            <div>🎫 張數：${ev.ticketCount}張 | 區域：${ev.ticketArea}</div>
            <div>🔗 連結：<a href="${ev.ticketLink}" target="_blank">點此前往</a></div>
          </div>
          <div class="item-timestamps">
            <div>📌 首次登記：${ev.createdAt || '無記錄'}</div>
            ${ev.updatedAt ? `<div>✏️ 最後編輯：${ev.updatedAt}</div>` : ''}
          </div>
          <div class="item-actions">
            <button class="action-btn edit-btn" onclick='onEditClick(${JSON.stringify(ev)})'>✏️ 編輯</button>
            <button class="action-btn delete-btn" onclick="onDeleteClick('${ev.id}')">🗑️ 刪除</button>
          </div>
        `;
        container.appendChild(item);
      });
    }

    function onEditClick(ev) {
      document.getElementById('editEventId').value = ev.id;
      document.getElementById('name').value = ev.name;
      document.getElementById('ticketDate').value = ev.ticketDate;
      document.getElementById('ticketTime').value = ev.ticketTime;
      document.getElementById('ticketLink').value = ev.ticketLink;
      document.getElementById('ticketCount').value = ev.ticketCount;
      document.getElementById('account').value = ev.account;
      document.getElementById('password').value = ev.password;
      document.getElementById('eventDate').value = (ev.eventDate !== '未指定') ? ev.eventDate : '';
      document.getElementById('ticketArea').value = (ev.ticketArea !== '未指定') ? ev.ticketArea : '';
      document.getElementById('priorityCode').value = (ev.priorityCode !== '無') ? ev.priorityCode : '';
      
      document.getElementById('submitBtn').innerText = "儲存修改";
      switchView('register');
    }

    async function onDeleteClick(eventId) {
      if (!confirm("確定要刪除這筆搶票登記嗎？")) return;
      const userId = await getUserId();
      try {
        await fetch(GAS_WEB_APP_URL, {
          method: "POST",
          headers: { "Content-Type": "application/x-www-form-urlencoded" },
          body: `action=delete_event&userId=${userId}&eventId=${eventId}`
        });
        alert("刪除成功！");
        fetchEventList();
      } catch (e) {
        alert("刪除失敗：" + e.message);
      }
    }
  </script>
</body>
</html>
