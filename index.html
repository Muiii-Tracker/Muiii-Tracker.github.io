<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>搶票資訊登記</title>
  <style>
    :root {
      --primary: #06C755;
      --primary-hover: #05b34c;
      --primary-soft: #f0faf3;
      --text-main: #191f28;
      --text-sub: #4e5968;
      --text-muted: #8b95a1;
      --border-color: #e5e8eb;
      --bg-color: #f4f6f8;
      --card-bg: #ffffff;
      --danger: #e93d3d;
      --danger-soft: #fef0f0;
      --radius-lg: 18px;
      --radius-md: 12px;
    }

    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      margin: 0;
      padding: 32px 16px 64px 16px;
      display: flex;
      justify-content: center;
      min-height: 100vh;
      color: var(--text-main);
    }

    /* 主卡片：自適應 PC 與手機端 */
    .card {
      background: var(--card-bg);
      width: 100%;
      max-width: 600px;
      border-radius: var(--radius-lg);
      padding: 28px 24px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04), 0 1px 3px rgba(0, 0, 0, 0.02);
      border: 1px solid rgba(230, 233, 237, 0.8);
      height: fit-content;
    }

    /* 頂部標題 */
    .app-header {
      text-align: center;
      margin-bottom: 24px;
    }

    .app-header h2 {
      color: var(--text-main);
      margin: 0;
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.3px;
    }

    /* 第一層：導覽切換 (iOS Segmented 質感) */
    .tabs {
      display: flex;
      background: #eaedf0;
      padding: 4px;
      border-radius: 12px;
      margin-bottom: 20px;
      gap: 4px;
    }

    .tab-btn {
      flex: 1;
      padding: 10px 0;
      text-align: center;
      background: transparent;
      border: none;
      font-size: 14.5px;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      border-radius: 9px;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .tab-btn.active {
      background: #ffffff;
      color: var(--text-main);
      font-weight: 700;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }

    /* 第二層：列表過濾標籤 */
    .filter-tabs {
      display: flex;
      background: #f2f4f6;
      border-radius: 10px;
      padding: 3px;
      gap: 4px;
      margin-bottom: 20px;
    }

    .filter-btn {
      flex: 1;
      padding: 8px 0;
      text-align: center;
      border: none;
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 13.5px;
      font-weight: 600;
      border-radius: 8px;
      transition: all 0.2s ease;
    }

    .filter-btn.active {
      background: #ffffff;
      color: var(--primary);
      font-weight: 700;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.05);
    }

    /* 區塊分割線 */
    .section-divider {
      font-size: 12px;
      font-weight: 700;
      color: var(--primary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin: 20px 0 12px 0;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .section-divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: var(--border-color);
    }

    .form-group {
      margin-bottom: 14px;
    }

    label {
      font-weight: 600;
      display: block;
      margin-bottom: 6px;
      font-size: 13.5px;
      color: var(--text-sub);
    }

    .required {
      color: var(--danger);
      font-weight: bold;
    }

    /* 輸入框 */
    input {
      width: 100%;
      height: 44px;
      padding: 10px 14px;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      box-sizing: border-box;
      font-size: 15px;
      background: #fbfcfd;
      color: var(--text-main);
      outline: none;
      transition: all 0.2s ease;
      -webkit-appearance: none;
    }

    input:hover {
      border-color: #cbd3dc;
    }

    input:focus {
      border-color: var(--primary);
      background: #ffffff;
      box-shadow: 0 0 0 3px rgba(6, 199, 85, 0.12);
    }

    input::placeholder {
      color: #b0b8c1;
      font-size: 14px;
    }

    /* 送出按鈕 */
    .primary-btn {
      width: 100%;
      height: 48px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: var(--radius-md);
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 24px;
      box-shadow: 0 4px 12px rgba(6, 199, 85, 0.2);
      transition: all 0.2s ease;
    }

    .primary-btn:hover {
      background: var(--primary-hover);
      transform: translateY(-1px);
    }

    .primary-btn:active {
      transform: translateY(0);
    }

    .primary-btn:disabled {
      background: #d1d6db;
      box-shadow: none;
      cursor: not-allowed;
      transform: none;
    }

    /* 列表行程卡片 */
    .item-card {
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 12px;
      background: #ffffff;
      transition: all 0.2s ease;
    }

    .item-card:hover {
      border-color: #cbd3dc;
      box-shadow: 0 3px 12px rgba(0, 0, 0, 0.04);
    }

    .item-card.is-expired {
      background: #fafbfb;
      opacity: 0.85;
    }

    .item-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .item-title {
      font-weight: 700;
      font-size: 16.5px;
      color: var(--text-main);
    }

    .item-badge {
      font-size: 12px;
      padding: 3px 8px;
      border-radius: 6px;
      font-weight: 700;
    }

    .badge-active {
      background: var(--primary-soft);
      color: var(--primary);
    }

    .badge-expired {
      background: #eaedf0;
      color: var(--text-muted);
    }

    .item-body {
      font-size: 13.5px;
      color: var(--text-sub);
      line-height: 1.7;
    }

    .item-body a {
      color: #3182f6;
      text-decoration: none;
      font-weight: 600;
    }

    .item-timestamps {
      font-size: 11.5px;
      color: var(--text-muted);
      margin-top: 10px;
      border-top: 1px dashed var(--border-color);
      padding-top: 8px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .item-actions {
      display: flex;
      gap: 8px;
      margin-top: 14px;
    }

    .action-btn {
      flex: 1;
      padding: 8px 0;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      border: none;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .edit-btn {
      background: #f2f4f6;
      color: var(--text-sub);
    }

    .edit-btn:hover {
      background: #e5e8eb;
    }

    .delete-btn {
      background: var(--danger-soft);
      color: var(--danger);
    }

    .delete-btn:hover {
      background: #fdd8d8;
    }

    /* 空狀態顯示 */
    .empty-msg {
      text-align: center;
      color: var(--text-muted);
      padding: 48px 0;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="app-header">
      <h2>🎫 搶票資訊登記</h2>
    </div>

    <!-- 頁籤選單 -->
    <div class="tabs">
      <button class="tab-btn active" id="tabRegister" onclick="switchView('register')">新增 / 編輯登記</button>
      <button class="tab-btn" id="tabList" onclick="switchView('list')">我的登記列表</button>
    </div>

    <!-- 表單 View -->
    <div id="viewRegister">
      <form id="ticketForm">
        <input type="hidden" id="editEventId" value="">
        <div class="section-divider">📌 必填欄位</div>
        <div class="form-group"><label>姓名 <span class="required">*</span></label><input type="text" id="name" placeholder="例如：張小明" required></div>
        <div class="form-group"><label>售票日期 <span class="required">*</span></label><input type="date" id="ticketDate" required></div>
        <div class="form-group"><label>售票時間 <span class="required">*</span></label><input type="time" id="ticketTime" required></div>
        <div class="form-group"><label>售票連結 <span class="required">*</span></label><input type="url" id="ticketLink" placeholder="https://..." required></div>
        <div class="form-group"><label>訂購張數 <span class="required">*</span></label><input type="number" id="ticketCount" placeholder="例如：2" min="1" required></div>
        <div class="form-group"><label>平台帳號 <span class="required">*</span></label><input type="text" id="account" placeholder="電子郵件、身分證、電話...等" required></div>
        <div class="form-group"><label>平台密碼 <span class="required">*</span></label><input type="text" id="password" placeholder="登入密碼" required></div>

        <div class="section-divider">✏️ 選填欄位</div>
        <div class="form-group"><label>演出日期 (選填)</label><input type="date" id="eventDate"></div>
        <div class="form-group"><label>票價區域 (選填)</label><input type="text" id="ticketArea" placeholder="例如：A區 4800"></div>
        <div class="form-group"><label>優先購票 (選填)</label><input type="text" id="priorityCode" placeholder="信用卡前N碼、會員代碼..."></div>

        <button type="button" id="submitBtn" class="primary-btn" onclick="submitData()">送出表單</button>
      </form>
    </div>

    <!-- 列表 View -->
    <div id="viewList" style="display: none;">
      <div class="filter-tabs">
        <button class="filter-btn active" id="btnActiveList" onclick="filterList('active')">進行中 (未過期)</button>
        <button class="filter-btn" id="btnExpiredList" onclick="filterList('expired')">歷史紀錄 (已過期)</button>
      </div>
      <div id="loadingText" style="text-align:center; padding: 32px; color: var(--text-muted); font-size: 14px;">載入中...</div>
      <div id="listContainer"></div>
    </div>
  </div>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script>
    const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwbjjKVDfgjqGNmlbK30tfe-7ybMTYNyJ6820IDMM-CSgjIIY4yx8FckBpjzF1sH7Ac/exec";
    const LIFF_ID = "2010930705-qUp1Ao2b";
    let allEvents = [];
    let currentFilter = 'active';

    window.addEventListener('hashchange', applyRouteFromHash);

    window.onload = async function() {
      try {
        await liff.init({ liffId: LIFF_ID });
        if (!liff.isLoggedIn()) {
          liff.login();
          return;
        }

        const params = new URLSearchParams(window.location.search);
        if (!window.location.hash && params.get("mode") === "list") {
          updateHash("list");
        } else {
          applyRouteFromHash();
        }
      } catch (err) {
        console.error("初始化失敗：", err);
      }
    };

    function applyRouteFromHash() {
      const hash = window.location.hash.toLowerCase();
      if (hash === '#list-expired') {
        currentFilter = 'expired';
        switchView('list', false);
        setFilterBtnState('expired');
      } else if (hash === '#list' || hash.startsWith('#list')) {
        currentFilter = 'active';
        switchView('list', false);
        setFilterBtnState('active');
      } else {
        switchView('register', false);
      }
    }

    function updateHash(targetHash) {
      if (window.location.hash !== targetHash) {
        history.replaceState(null, "", targetHash);
      }
    }

    function switchView(view, syncHash = true) {
      if (view === 'register') {
        document.getElementById('viewRegister').style.display = 'block';
        document.getElementById('viewList').style.display = 'none';
        document.getElementById('tabRegister').classList.add('active');
        document.getElementById('tabList').classList.remove('active');
        if (syncHash) updateHash('#register');
      } else {
        document.getElementById('viewRegister').style.display = 'none';
        document.getElementById('viewList').style.display = 'block';
        document.getElementById('tabRegister').classList.remove('active');
        document.getElementById('tabList').classList.add('active');
        if (syncHash) {
          updateHash(currentFilter === 'expired' ? '#list-expired' : '#list');
        }
        fetchEventList();
      }
    }

    function setFilterBtnState(type) {
      document.getElementById('btnActiveList').classList.toggle('active', type === 'active');
      document.getElementById('btnExpiredList').classList.toggle('active', type === 'expired');
    }

    async function getUserId() {
      if (liff.isLoggedIn()) {
        const p = await liff.getProfile();
        return p.userId;
      }
      return "";
    }

    async function submitData() {
      const name = document.getElementById('name').value.trim();
      const ticketDate = document.getElementById('ticketDate').value;
      const ticketTime = document.getElementById('ticketTime').value;
      const ticketLink = document.getElementById('ticketLink').value.trim();
      const ticketCount = document.getElementById('ticketCount').value;
      const account = document.getElementById('account').value.trim();
      const password = document.getElementById('password').value.trim();

      if (!name || !ticketDate || !ticketTime || !ticketLink || !ticketCount || !account || !password) {
        alert("請確保所有【必填欄位】均已正確填寫！");
        return;
      }

      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.innerText = "處理中...";

      let userId = "";
      try {
        userId = await getUserId();
      } catch (e) {
        console.warn("無法取得 Profile", e);
      }

      const editEventId = document.getElementById('editEventId').value;
      const payload = {
        action: "submit_form",
        userId: userId,
        editEventId: editEventId,
        name: name,
        ticketDate: ticketDate,
        ticketTime: ticketTime,
        ticketLink: ticketLink,
        ticketCount: ticketCount,
        account: account,
        password: password,
        eventDate: document.getElementById('eventDate').value || "未指定",
        ticketArea: document.getElementById('ticketArea').value.trim() || "未指定",
        priorityCode: document.getElementById('priorityCode').value.trim() || "無"
      };

      try {
        await fetch(GAS_WEB_APP_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        if (liff.isInClient()) {
          await liff.sendMessages([{ type: "text", text: "核對資料" }]);
          liff.closeWindow();
        } else {
          alert("已送出！請到 LINE 聊天室確認。");
          btn.disabled = false;
          btn.innerText = "送出表單";
        }
      } catch (err) {
        alert("送出失敗：" + err.message);
        btn.disabled = false;
        btn.innerText = "重新送出";
      }
    }

    async function fetchEventList() {
      document.getElementById('loadingText').style.display = 'block';
      document.getElementById('listContainer').innerHTML = '';

      const userId = await getUserId();
      if (!userId) {
        document.getElementById('loadingText').innerText = "無法取得資料，請重新開啟。";
        return;
      }

      try {
        const resp = await fetch(`${GAS_WEB_APP_URL}?action=get_events&userId=${encodeURIComponent(userId)}`);
        allEvents = await resp.json();
        document.getElementById('loadingText').style.display = 'none';
        renderList();
      } catch (e) {
        document.getElementById('loadingText').innerText = "載入失敗，請稍後重試。";
      }
    }

    function filterList(type) {
      currentFilter = type;
      setFilterBtnState(type);
      updateHash(type === 'expired' ? '#list-expired' : '#list');
      renderList();
    }

    function renderList() {
      const container = document.getElementById('listContainer');
      container.innerHTML = '';
      const now = new Date().getTime();

      const filtered = allEvents.filter(ev => {
        const evTime = new Date(`${ev.ticketDate}T${ev.ticketTime}:00`).getTime();
        return currentFilter === 'active' ? evTime >= now : evTime < now;
      });

      if (filtered.length === 0) {
        container.innerHTML = `<div class="empty-msg">查無${currentFilter === 'active' ? '進行中' : '歷史'}行程</div>`;
        return;
      }

      filtered.forEach(ev => {
        const evTime = new Date(`${ev.ticketDate}T${ev.ticketTime}:00`).getTime();
        const isExpired = evTime < now;
        const item = document.createElement('div');
        item.className = `item-card ${isExpired ? 'is-expired' : ''}`;
        item.innerHTML = `
          <div class="item-header">
            <span class="item-title">${ev.name}</span>
            <span class="item-badge ${isExpired ? 'badge-expired' : 'badge-active'}">${isExpired ? '已過期' : '進行中'}</span>
          </div>
          <div class="item-body">
            <div>⏰ 售票時間：<strong>${ev.ticketDate} ${ev.ticketTime}</strong></div>
            <div>🎫 訂購張數：${ev.ticketCount}張 ｜ 區域：${ev.ticketArea}</div>
            <div>🔗 售票連結：<a href="${ev.ticketLink}" target="_blank" rel="noopener">點此前往售票頁</a></div>
          </div>
          <div class="item-timestamps">
            <div>📌 首次登記：${ev.createdAt || '無記錄'}</div>
            ${ev.updatedAt ? `<div>✏️ 最後編輯：${ev.updatedAt}</div>` : ''}
          </div>
          <div class="item-actions">
            <button class="action-btn edit-btn" onclick='onEditClick(${JSON.stringify(ev)})'>✏️ 編輯</button>
            <button class="action-btn delete-btn" onclick="onDeleteClick('${ev.id}')">🗑️ 刪除</button>
          </div>
        `;
        container.appendChild(item);
      });
    }

    function onEditClick(ev) {
      document.getElementById('editEventId').value = ev.id;
      document.getElementById('name').value = ev.name;
      document.getElementById('ticketDate').value = ev.ticketDate;
      document.getElementById('ticketTime').value = ev.ticketTime;
      document.getElementById('ticketLink').value = ev.ticketLink;
      document.getElementById('ticketCount').value = ev.ticketCount;
      document.getElementById('account').value = ev.account;
      document.getElementById('password').value = ev.password;
      document.getElementById('eventDate').value = (ev.eventDate !== '未指定') ? ev.eventDate : '';
      document.getElementById('ticketArea').value = (ev.ticketArea !== '未指定') ? ev.ticketArea : '';
      document.getElementById('priorityCode').value = (ev.priorityCode !== '無') ? ev.priorityCode : '';
      
      document.getElementById('submitBtn').innerText = "儲存修改";
      switchView('register');
    }

    async function onDeleteClick(eventId) {
      if (!confirm("確定要刪除這筆搶票登記嗎？")) return;
      const userId = await getUserId();
      try {
        await fetch(GAS_WEB_APP_URL, {
          method: "POST",
          headers: { "Content-Type": "application/x-www-form-urlencoded" },
          body: `action=delete_event&userId=${encodeURIComponent(userId)}&eventId=${encodeURIComponent(eventId)}`
        });
        alert("刪除成功！");
        fetchEventList();
      } catch (e) {
        alert("刪除失敗：" + e.message);
      }
    }
  </script>
</body>
</html>
