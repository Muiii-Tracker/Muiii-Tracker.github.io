<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Muiii 管理後台</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;800&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', 'Noto Sans TC', sans-serif; background-color: #f8fafc; }
    .modal-bg { display: none; position: fixed; inset: 0; z-index: 50; background: rgba(15, 23, 42, 0.65); backdrop-filter: blur(4px); align-items: center; justify-content: center; padding: 16px; }
    .modal-bg.active { display: flex; }
  </style>
</head>
<body class="text-slate-800 antialiased min-h-screen flex flex-col">

  <div class="flex-grow pb-16">
    <header class="bg-white border-b border-slate-200 sticky top-0 z-30">
      <div class="container mx-auto px-4 max-w-6xl py-4 flex flex-wrap items-center justify-between gap-3">
        <div class="flex items-center gap-3">
          <span class="text-xl font-black italic tracking-tighter text-slate-900">Muiii</span>
          <span class="text-xs font-bold px-2 py-0.5 rounded-md bg-slate-100 text-slate-600">管理後台</span>
          <div class="flex bg-slate-100 p-1 rounded-xl gap-1">
            <button id="navOrders" onclick="switchTab('orders')" class="px-3 py-1.5 rounded-lg text-xs font-bold bg-white text-slate-900 shadow-sm transition">📋 管理資料</button>
            <button id="navRecords" onclick="switchTab('records')" class="px-3 py-1.5 rounded-lg text-xs font-bold text-slate-500 hover:text-slate-900 transition">🏆 戰績管理</button>
            <button id="navAddRecord" onclick="switchTab('addRecord')" class="px-3 py-1.5 rounded-lg text-xs font-bold text-slate-500 hover:text-slate-900 transition">➕ 新增戰績</button>
          </div>
        </div>
        <div class="flex items-center gap-2">
          <a href="../Record/" target="_blank" class="px-3.5 py-2 rounded-xl bg-emerald-50 hover:bg-emerald-100 text-xs font-bold transition flex items-center gap-1.5 text-emerald-700">
            <i class="fas fa-external-link-alt"></i> 查看戰績
          </a>
          <button onclick="refreshCurrentTab()" class="px-3.5 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-xs font-bold transition flex items-center gap-1.5 text-slate-600">
            <i class="fas fa-rotate"></i> 重新載入
          </button>
        </div>
      </div>
    </header>

    <main id="tabOrders" class="container mx-auto px-4 max-w-6xl mt-6">
      <div class="flex flex-col sm:flex-row items-center justify-between gap-3 bg-white p-3 rounded-2xl border border-slate-200 mb-6 shadow-sm">
        <div class="relative w-full sm:w-80">
          <i class="fas fa-search absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
          <input type="text" id="adminSearchInput" oninput="renderAdminList()" placeholder="搜尋姓名、帳號、售票時間..." class="w-full pl-9 pr-3 py-2 text-sm rounded-xl bg-slate-50 border border-slate-200 focus:outline-none focus:border-emerald-500 font-bold">
        </div>
        <div class="flex items-center gap-2 w-full sm:w-auto">
          <select id="statusFilter" onchange="renderAdminList()" class="px-3 py-2 text-sm rounded-xl bg-slate-50 border border-slate-200 font-bold text-slate-600 focus:outline-none flex-1 sm:flex-none">
            <option value="all">所有狀態</option>
            <option value="pending">待搶票 / 處理中</option>
            <option value="success">🎉 搶票成功</option>
            <option value="failed">❌ 搶票失敗</option>
          </select>
          <select id="sortSelect" onchange="renderAdminList()" class="px-3 py-2 text-sm rounded-xl bg-slate-50 border border-slate-200 font-bold text-emerald-600 focus:outline-none flex-1 sm:flex-none">
            <option value="desc">新到舊</option>
            <option value="asc">舊到新</option>
          </select>
        </div>
      </div>

      <div id="loadingOrders" class="text-center py-20 text-slate-400 font-bold text-sm">
        <i class="fas fa-spinner animate-spin text-2xl text-emerald-500 mb-2 block"></i> 資料中載入...
      </div>

      <div id="adminCardList" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
    </main>

    <main id="tabRecords" class="container mx-auto px-4 max-w-6xl mt-6 hidden">
      <div class="flex flex-col sm:flex-row items-center justify-between gap-3 bg-white p-3 rounded-2xl border border-slate-200 mb-6 shadow-sm">
        <div class="relative w-full sm:w-80">
          <i class="fas fa-search absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
          <input type="text" id="recordSearchInput" oninput="renderRecordsList()" placeholder="搜尋戰績節目、平台、日期..." class="w-full pl-9 pr-3 py-2 text-sm rounded-xl bg-slate-50 border border-slate-200 focus:outline-none focus:border-emerald-500 font-bold">
        </div>
        <div class="flex items-center gap-2 w-full sm:w-auto">
          <select id="recordSortSelect" onchange="renderRecordsList()" class="px-3 py-2 text-sm rounded-xl bg-slate-50 border border-slate-200 font-bold text-emerald-600 focus:outline-none flex-1 sm:flex-none">
            <option value="desc">新到舊</option>
            <option value="asc">舊到新</option>
          </select>
          <button onclick="switchTab('addRecord')" class="px-4 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs transition shadow-sm whitespace-nowrap">
            ➕ 新增戰績
          </button>
        </div>
      </div>

      <div id="loadingRecords" class="text-center py-20 text-slate-400 font-bold text-sm">
        <i class="fas fa-spinner animate-spin text-2xl text-emerald-500 mb-2 block"></i> 資料中載入...
      </div>

      <div id="recordsCardList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
    </main>

    <main id="tabAddRecord" class="container mx-auto px-4 max-w-2xl mt-6 hidden">
      <div class="bg-white rounded-3xl border border-slate-200 p-6 sm:p-8 shadow-sm">
        <div class="flex items-center justify-between mb-6 pb-4 border-b border-slate-100">
          <div>
            <h2 class="text-xl font-black text-slate-900">🏆 新增戰績至試算表</h2>
            <p class="text-xs text-slate-400 font-bold mt-1">送出後將自動插入至試算表最上方</p>
          </div>
        </div>

        <div class="space-y-4">
          <div>
            <label class="block text-xs font-bold text-slate-500 mb-1.5">售票日期 *</label>
            <input type="text" id="recDate" placeholder="例如：2026.09.26" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 font-bold text-sm focus:outline-none focus:border-emerald-500">
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-500 mb-1.5">節目名稱 *</label>
            <input type="text" id="recTitle" placeholder="例如：MAMAMOO 2026 WORLD TOUR ＜4WARD＞ in TAIPEI" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 font-bold text-sm focus:outline-none focus:border-emerald-500">
          </div>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
              <label class="block text-xs font-bold text-slate-500 mb-1.5">售票平台 *</label>
              <input type="text" id="recPlatform" list="platformOptions" placeholder="選擇或輸入售票平台" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 font-bold text-sm focus:outline-none focus:border-emerald-500">
              <datalist id="platformOptions"></datalist>
            </div>
            <div>
              <label class="block text-xs font-bold text-slate-500 mb-1.5">張數 *</label>
              <input type="text" id="recCount" placeholder="例如：12/05_黃3H區1800*2" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 font-bold text-sm focus:outline-none focus:border-emerald-500">
            </div>
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-500 mb-1.5">戰報截圖</label>
            <div id="recDropZone" onclick="triggerFileInput('recFileInput')" class="border-2 border-dashed border-slate-300 hover:border-emerald-500 rounded-2xl p-4 text-center cursor-pointer transition bg-slate-50 relative group">
              <input type="file" id="recFileInput" accept="image/*" class="hidden" onchange="handleFileChange(event, 'recPreview', 'recDropPrompt', 'rec')">
              <div id="recDropPrompt" class="py-3">
                <i class="fas fa-cloud-arrow-up text-2xl text-slate-400 mb-1 block group-hover:text-emerald-500 transition"></i>
                <span class="text-xs font-bold text-slate-600 block">點擊上傳，或直接在此按 Ctrl + V 貼上截圖</span>
                <span class="text-[10px] text-slate-400">支援 PNG、JPG 等圖片</span>
              </div>
              <div id="recPreviewContainer" class="hidden relative">
                <img id="recPreview" src="" class="max-h-44 mx-auto rounded-xl shadow-sm object-contain">
                <button type="button" onclick="clearImage(event, 'rec')" class="absolute top-1 right-1 bg-slate-900/70 hover:bg-slate-900 text-white w-6 h-6 rounded-full flex items-center justify-center text-xs transition">
                  <i class="fas fa-times"></i>
                </button>
              </div>
            </div>
            <div class="mt-2">
              <input type="url" id="recImage" placeholder="或手動填寫圖片網址 https://..." class="w-full px-3 py-2 rounded-xl border border-slate-200 font-medium text-xs focus:outline-none focus:border-emerald-500">
            </div>
          </div>

          <button id="btnSubmitRecord" onclick="submitNewRecord()" class="w-full py-3.5 mt-2 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-black text-sm shadow-lg shadow-emerald-600/20 transition">
            ➕ 新增戰績至試算表
          </button>
        </div>
      </div>
    </main>
  </div>

  <div id="publishModal" class="modal-bg" onclick="closePublishModal()">
    <div class="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl border border-slate-200" onclick="event.stopPropagation()">
      <div class="flex items-center justify-between pb-3 border-b border-slate-100">
        <h3 class="text-base font-black text-slate-900">🚀 搶票成功</h3>
        <button onclick="closePublishModal()" class="text-slate-400 hover:text-slate-700"><i class="fas fa-times"></i></button>
      </div>
      <div class="space-y-3 mt-4 text-xs">
        <input type="hidden" id="modalEventId">
        <div>
          <label class="font-bold text-slate-500 block mb-1">售票日期</label>
          <input type="text" id="modalDate" class="w-full px-3 py-2 rounded-xl border border-slate-200 font-bold">
        </div>
        <div>
          <label class="font-bold text-slate-500 block mb-1">節目名稱 *</label>
          <input type="text" id="modalTitle" placeholder="請輸入演唱會或活動名稱..." class="w-full px-3 py-2 rounded-xl border border-emerald-500 bg-emerald-50/20 font-bold focus:outline-none">
        </div>
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="font-bold text-slate-500 block mb-1">售票平台</label>
            <input type="text" id="modalPlatform" list="platformOptions" class="w-full px-3 py-2 rounded-xl border border-slate-200 font-bold">
          </div>
          <div>
            <label class="font-bold text-slate-500 block mb-1">張數</label>
            <input type="text" id="modalCount" class="w-full px-3 py-2 rounded-xl border border-slate-200 font-bold">
          </div>
        </div>
        <div>
          <label class="font-bold text-slate-500 block mb-1">戰報截圖</label>
          <div id="modalDropZone" onclick="triggerFileInput('modalFileInput')" class="border-2 border-dashed border-slate-300 hover:border-emerald-500 rounded-xl p-3 text-center cursor-pointer transition bg-slate-50 relative group">
            <input type="file" id="modalFileInput" accept="image/*" class="hidden" onchange="handleFileChange(event, 'modalPreview', 'modalDropPrompt', 'modal')">
            <div id="modalDropPrompt" class="py-2">
              <i class="fas fa-camera text-xl text-slate-400 mb-1 block group-hover:text-emerald-500 transition"></i>
              <span class="text-xs font-bold text-slate-600 block">點擊上傳或按 Ctrl + V 貼上截圖</span>
            </div>
            <div id="modalPreviewContainer" class="hidden relative">
              <img id="modalPreview" src="" class="max-h-36 mx-auto rounded-lg shadow-sm object-contain">
              <button type="button" onclick="clearImage(event, 'modal')" class="absolute top-1 right-1 bg-slate-900/70 hover:bg-slate-900 text-white w-5 h-5 rounded-full flex items-center justify-center text-[10px] transition">
                <i class="fas fa-times"></i>
              </button>
            </div>
          </div>
          <div class="mt-1.5">
            <input type="url" id="modalImage" placeholder="或填寫圖片網址 https://..." class="w-full px-2.5 py-1.5 rounded-lg border border-slate-200 text-xs font-medium focus:outline-none focus:border-emerald-500">
          </div>
        </div>
      </div>
      <div class="mt-5 flex gap-2">
        <button onclick="closePublishModal()" class="flex-1 py-2.5 rounded-xl bg-slate-100 font-bold text-xs text-slate-600">取消</button>
        <button id="btnModalConfirm" onclick="confirmPublishAndSuccess()" class="flex-1 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs shadow-md shadow-emerald-600/20">確認發布</button>
      </div>
    </div>
  </div>

  <div id="editRecordModal" class="modal-bg" onclick="closeEditRecordModal()">
    <div class="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl border border-slate-200" onclick="event.stopPropagation()">
      <div class="flex items-center justify-between pb-3 border-b border-slate-100">
        <h3 class="text-base font-black text-slate-900">✏️ 修改戰績資料</h3>
        <button onclick="closeEditRecordModal()" class="text-slate-400 hover:text-slate-700"><i class="fas fa-times"></i></button>
      </div>
      <div class="space-y-3 mt-4 text-xs">
        <input type="hidden" id="editRecordRowIndex">
        <div>
          <label class="font-bold text-slate-500 block mb-1">售票日期 *</label>
          <input type="text" id="editRecordDate" class="w-full px-3 py-2 rounded-xl border border-slate-200 font-bold">
        </div>
        <div>
          <label class="font-bold text-slate-500 block mb-1">節目名稱 *</label>
          <input type="text" id="editRecordTitle" class="w-full px-3 py-2 rounded-xl border border-emerald-500 bg-emerald-50/20 font-bold focus:outline-none">
        </div>
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="font-bold text-slate-500 block mb-1">售票平台 *</label>
            <input type="text" id="editRecordPlatform" list="platformOptions" class="w-full px-3 py-2 rounded-xl border border-slate-200 font-bold">
          </div>
          <div>
            <label class="font-bold text-slate-500 block mb-1">張數 *</label>
            <input type="text" id="editRecordCount" class="w-full px-3 py-2 rounded-xl border border-slate-200 font-bold">
          </div>
        </div>
        <div>
          <label class="font-bold text-slate-500 block mb-1">戰報截圖</label>
          <div id="editDropZone" onclick="triggerFileInput('editFileInput')" class="border-2 border-dashed border-slate-300 hover:border-emerald-500 rounded-xl p-3 text-center cursor-pointer transition bg-slate-50 relative group">
            <input type="file" id="editFileInput" accept="image/*" class="hidden" onchange="handleFileChange(event, 'editPreview', 'editDropPrompt', 'edit')">
            <div id="editDropPrompt" class="py-2">
              <i class="fas fa-camera text-xl text-slate-400 mb-1 block group-hover:text-emerald-500 transition"></i>
              <span class="text-xs font-bold text-slate-600 block">點擊更換或按 Ctrl + V 貼上新截圖</span>
            </div>
            <div id="editPreviewContainer" class="hidden relative">
              <img id="editPreview" src="" class="max-h-36 mx-auto rounded-lg shadow-sm object-contain">
              <button type="button" onclick="clearImage(event, 'edit')" class="absolute top-1 right-1 bg-slate-900/70 hover:bg-slate-900 text-white w-5 h-5 rounded-full flex items-center justify-center text-[10px] transition">
                <i class="fas fa-times"></i>
              </button>
            </div>
          </div>
          <div class="mt-1.5">
            <input type="url" id="editRecordImage" placeholder="或填寫圖片網址 https://..." class="w-full px-2.5 py-1.5 rounded-lg border border-slate-200 text-xs font-medium focus:outline-none focus:border-emerald-500">
          </div>
        </div>
      </div>
      <div class="mt-5 flex gap-2">
        <button onclick="closeEditRecordModal()" class="flex-1 py-2.5 rounded-xl bg-slate-100 font-bold text-xs text-slate-600">取消</button>
        <button id="btnEditRecordConfirm" onclick="confirmUpdateRecord()" class="flex-1 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs shadow-md shadow-emerald-600/20">儲存變更</button>
      </div>
    </div>
  </div>

  <script>
    const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwbjjKVDfgjqGNmlbK30tfe-7ybMTYNyJ6820IDMM-CSgjIIY4yx8FckBpjzF1sH7Ac/exec";
    let currentTab = 'orders';
    let adminEvents = [];
    let sheetRecords = [];
    let defaultPlatforms = [
      "Tixcraft 拓元售票", "添翼 Teamear", "Indievox 獨立音樂", "KKTIX", "iBon",
      "FamiTicket 全網", "Kham 寬宏售票", "Ticket.com.tw 年代", "UDN售票網",
      "TicketPlus 遠大", "FunOne Tickets", "FANSI GO", "Urbtix 城市",
      "Cityline 買飛", "HKTicketing 快達票", "澳門銀河", "TicketMaster Singapore",
      "Ticketek Australia", "KLOOK"
    ];

    let recBase64 = "";
    let modalBase64 = "";
    let editBase64 = "";

    window.onload = function() {
      renderPlatformDatalist(defaultPlatforms);
      fetchAdminEvents();
      setupPasteListener();
      const d = new Date();
      const pad = n => String(n).padStart(2, '0');
      document.getElementById('recDate').value = `${d.getFullYear()}.${pad(d.getMonth()+1)}.${pad(d.getDate())}`;
    };

    function triggerFileInput(id) {
      document.getElementById(id).click();
    }

    function refreshCurrentTab() {
      if (currentTab === 'orders') {
        fetchAdminEvents();
      } else if (currentTab === 'records') {
        fetchSheetRecords();
      }
    }

    function setupPasteListener() {
      document.addEventListener("paste", function(e) {
        const items = (e.clipboardData || e.originalEvent.clipboardData).items;
        let blob = null;
        for (let i = 0; i < items.length; i++) {
          if (items[i].type.indexOf("image") !== -1) {
            blob = items[i].getAsFile();
            break;
          }
        }
        if (!blob) return;

        if (document.getElementById('editRecordModal').classList.contains('active')) {
          processImageFile(blob, 'editPreview', 'editDropPrompt', 'edit');
        } else if (document.getElementById('publishModal').classList.contains('active')) {
          processImageFile(blob, 'modalPreview', 'modalDropPrompt', 'modal');
        } else {
          processImageFile(blob, 'recPreview', 'recDropPrompt', 'rec');
        }
      });
    }

    function handleFileChange(event, previewId, promptId, type) {
      const file = event.target.files[0];
      if (file) {
        processImageFile(file, previewId, promptId, type);
      }
    }

    function processImageFile(file, previewId, promptId, type) {
      const reader = new FileReader();
      reader.onload = function(e) {
        const b64 = e.target.result;
        if (type === 'modal') {
          modalBase64 = b64;
          document.getElementById('modalImage').value = '';
          document.getElementById('modalPreview').src = b64;
          document.getElementById('modalDropPrompt').classList.add('hidden');
          document.getElementById('modalPreviewContainer').classList.remove('hidden');
        } else if (type === 'edit') {
          editBase64 = b64;
          document.getElementById('editRecordImage').value = '';
          document.getElementById('editPreview').src = b64;
          document.getElementById('editDropPrompt').classList.add('hidden');
          document.getElementById('editPreviewContainer').classList.remove('hidden');
        } else {
          recBase64 = b64;
          document.getElementById('recImage').value = '';
          document.getElementById('recPreview').src = b64;
          document.getElementById('recDropPrompt').classList.add('hidden');
          document.getElementById('recPreviewContainer').classList.remove('hidden');
        }
      };
      reader.readAsDataURL(file);
    }

    function clearImage(e, type) {
      e.stopPropagation();
      if (type === 'modal') {
        modalBase64 = '';
        document.getElementById('modalFileInput').value = '';
        document.getElementById('modalPreview').src = '';
        document.getElementById('modalDropPrompt').classList.remove('hidden');
        document.getElementById('modalPreviewContainer').classList.add('hidden');
      } else if (type === 'edit') {
        editBase64 = '';
        document.getElementById('editFileInput').value = '';
        document.getElementById('editPreview').src = '';
        document.getElementById('editDropPrompt').classList.remove('hidden');
        document.getElementById('editPreviewContainer').classList.add('hidden');
      } else {
        recBase64 = '';
        document.getElementById('recFileInput').value = '';
        document.getElementById('recPreview').src = '';
        document.getElementById('recDropPrompt').classList.remove('hidden');
        document.getElementById('recPreviewContainer').classList.add('hidden');
      }
    }

    function renderPlatformDatalist(list) {
      const dl = document.getElementById('platformOptions');
      dl.innerHTML = list.map(p => `<option value="${p}">`).join('');
    }

    function switchTab(tab) {
      currentTab = tab;
      const isOrders = tab === 'orders';
      const isRecords = tab === 'records';
      const isAdd = tab === 'addRecord';

      document.getElementById('tabOrders').classList.toggle('hidden', !isOrders);
      document.getElementById('tabRecords').classList.toggle('hidden', !isRecords);
      document.getElementById('tabAddRecord').classList.toggle('hidden', !isAdd);

      document.getElementById('navOrders').className = isOrders
        ? "px-3 py-1.5 rounded-lg text-xs font-bold bg-white text-slate-900 shadow-sm transition"
        : "px-3 py-1.5 rounded-lg text-xs font-bold text-slate-500 hover:text-slate-900 transition";
      document.getElementById('navRecords').className = isRecords
        ? "px-3 py-1.5 rounded-lg text-xs font-bold bg-white text-slate-900 shadow-sm transition"
        : "px-3 py-1.5 rounded-lg text-xs font-bold text-slate-500 hover:text-slate-900 transition";
      document.getElementById('navAddRecord').className = isAdd
        ? "px-3 py-1.5 rounded-lg text-xs font-bold bg-white text-slate-900 shadow-sm transition"
        : "px-3 py-1.5 rounded-lg text-xs font-bold text-slate-500 hover:text-slate-900 transition";

      if (isRecords && sheetRecords.length === 0) {
        fetchSheetRecords();
      }
    }

    function detectPlatformFromUrl(url) {
      const u = (url || '').toLowerCase();
      if (u.includes('tixcraft')) return 'Tixcraft 拓元售票';
      if (u.includes('teamear')) return '添翼 Teamear';
      if (u.includes('indievox')) return 'Indievox 獨立音樂';
      if (u.includes('kktix')) return 'KKTIX';
      if (u.includes('ibon')) return 'iBon';
      if (u.includes('fami')) return 'FamiTicket 全網';
      if (u.includes('kham')) return 'Kham 寬宏售票';
      if (u.includes('ticket.com.tw')) return 'Ticket.com.tw 年代';
      if (u.includes('udnfunlife')) return 'UDN售票網';
      if (u.includes('ticketplus')) return 'TicketPlus 遠大';
      if (u.includes('funone')) return 'FunOne Tickets';
      if (u.includes('fansi')) return 'FANSI GO';
      if (u.includes('urbtix')) return 'Urbtix 城市';
      if (u.includes('cityline')) return 'Cityline 買飛';
      if (u.includes('hkticketing')) return 'HKTicketing 快達票';
      if (u.includes('galaxymacau')) return '澳門銀河';
      if (u.includes('ticketmaster')) return 'TicketMaster Singapore';
      if (u.includes('ticketek')) return 'Ticketek Australia';
      if (u.includes('klook')) return 'KLOOK';
      return 'Tixcraft 拓元售票';
    }

    function buildFormattedCountTag(ev) {
      let datePrefix = "";
      if (ev.eventDate && ev.eventDate !== "未指定") {
        const parts = ev.eventDate.split(/[-/.]/);
        if (parts.length >= 3) {
          datePrefix = `${parts[1].padStart(2, '0')}/${parts[2].padStart(2, '0')}_`;
        }
      }
      const areaStr = (ev.ticketArea && ev.ticketArea !== "未指定") ? ev.ticketArea.replace(/\s+/g, '') : "";
      const cnt = ev.ticketCount || 1;
      if (datePrefix || areaStr) {
        return `${datePrefix}${areaStr}*${cnt}`;
      }
      return `${cnt}張`;
    }

    async function fetchAdminEvents() {
      document.getElementById('loadingOrders').classList.remove('hidden');
      document.getElementById('adminCardList').innerHTML = '';

      try {
        const resp = await fetch(`${GAS_WEB_APP_URL}?action=get_all_events_admin`);
        const data = await resp.json();
        if (Array.isArray(data)) {
          adminEvents = data;
        } else {
          adminEvents = Array.isArray(data.events) ? data.events : [];
          if (Array.isArray(data.platforms) && data.platforms.length > 0) {
            renderPlatformDatalist(data.platforms);
          }
        }
        document.getElementById('loadingOrders').classList.add('hidden');
        renderAdminList();
      } catch (e) {
        document.getElementById('loadingOrders').innerHTML = "載入失敗，請確認網路或重新整理。";
      }
    }

    function renderAdminList() {
      const search = document.getElementById('adminSearchInput').value.toLowerCase().trim();
      const statusSelect = document.getElementById('statusFilter').value;
      const sortSelect = document.getElementById('sortSelect').value;
      const listContainer = document.getElementById('adminCardList');
      listContainer.innerHTML = '';

      const filtered = adminEvents.filter(ev => {
        const matchText = ((ev.name || '') + (ev.account || '') + (ev.ticketDate || '') + (ev.ticketTime || '')).toLowerCase().includes(search);
        const s = (ev.status || '').trim();
        let matchStatus = true;
        if (statusSelect === 'success') matchStatus = s === '成功' || s === '搶票成功';
        else if (statusSelect === 'failed') matchStatus = s === '失敗' || s === '未搶到';
        else if (statusSelect === 'pending') matchStatus = !s || (s !== '成功' && s !== '失敗');
        return matchText && matchStatus;
      });

      filtered.sort((a, b) => {
        const t1 = `${a.ticketDate || ''} ${a.ticketTime || ''}`.trim();
        const t2 = `${b.ticketDate || ''} ${b.ticketTime || ''}`.trim();
        return sortSelect === 'desc' ? t2.localeCompare(t1) : t1.localeCompare(t2);
      });

      if (filtered.length === 0) {
        listContainer.innerHTML = `<div class="col-span-full text-center py-20 text-slate-400 font-bold">無符合資料</div>`;
        return;
      }

      filtered.forEach((ev) => {
        const card = document.createElement('div');
        card.className = "bg-white rounded-2xl border border-slate-200 p-5 shadow-sm flex flex-col justify-between";

        const s = (ev.status || '').trim();
        const isHandled = (s === '成功' || s === '搶票成功' || s === '失敗' || s === '未搶到');

        let statusBadge = `<span class="px-2.5 py-1 rounded-full text-xs font-bold bg-amber-50 text-amber-700 border border-amber-200">⌛ 處理中</span>`;
        if (s === '成功' || s === '搶票成功') {
          statusBadge = `
            <div class="flex items-center gap-1.5">
              <span class="px-2.5 py-1 rounded-full text-xs font-bold bg-emerald-50 text-emerald-700 border border-emerald-200">🎉 搶票成功</span>
              <button onclick="updateEventStatus('${ev.id}', '')" title="重設為待處理" class="text-slate-400 hover:text-slate-600 text-xs px-1.5 py-0.5 rounded hover:bg-slate-100 transition"><i class="fas fa-undo"></i></button>
            </div>
          `;
        } else if (s === '失敗' || s === '未搶到') {
          statusBadge = `
            <div class="flex items-center gap-1.5">
              <span class="px-2.5 py-1 rounded-full text-xs font-bold bg-rose-50 text-rose-700 border border-rose-200">❌ 搶票失敗</span>
              <button onclick="updateEventStatus('${ev.id}', '')" title="重設為待處理" class="text-slate-400 hover:text-slate-600 text-xs px-1.5 py-0.5 rounded hover:bg-slate-100 transition"><i class="fas fa-undo"></i></button>
            </div>
          `;
        }

        const realIndex = adminEvents.findIndex(item => item.id === ev.id);

        const actionButtonsHtml = isHandled ? '' : `
          <div class="mt-4 pt-3 border-t border-slate-100 flex flex-wrap gap-2">
            <button onclick="openPublishModal(${realIndex})" class="flex-1 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs transition shadow-sm">
              🚀 搶票成功
            </button>
            <button onclick="updateEventStatus('${ev.id}', '失敗')" class="flex-1 py-2.5 rounded-xl bg-rose-50 hover:bg-rose-100 text-rose-700 font-bold text-xs transition border border-rose-200">
              ❌ 搶票失敗
            </button>
          </div>
        `;

        card.innerHTML = `
          <div>
            <div class="flex items-center justify-between pb-3 border-b border-slate-100">
              <span class="text-lg font-black text-slate-900">${ev.name}</span>
              ${statusBadge}
            </div>

            <div class="mt-3 space-y-2 text-xs font-medium text-slate-600">
              <div class="flex justify-between"><span class="text-slate-400 font-bold">⏰ 售票時間</span><span class="font-bold text-slate-800">${ev.ticketDate} ${ev.ticketTime}</span></div>
              <div class="flex justify-between"><span class="text-slate-400 font-bold">🎫 訂購張數</span><span class="font-bold text-emerald-600">${ev.ticketCount || 1} 張</span></div>
              <div class="flex justify-between"><span class="text-slate-400 font-bold">💺 區域/演出</span><span>${ev.ticketArea} / ${ev.eventDate}</span></div>
              <div class="flex justify-between"><span class="text-slate-400 font-bold">💳 優先代碼</span><span>${ev.priorityCode || '無'}</span></div>

              <div class="bg-slate-50 p-2.5 rounded-xl border border-slate-100 mt-2 space-y-1">
                <div class="flex items-center justify-between">
                  <span class="font-mono text-slate-500 font-bold">🔑 ${ev.account}</span>
                  <button onclick="copyText('${ev.account}')" class="text-emerald-600 hover:text-emerald-700 font-bold text-[11px]">複製帳號</button>
                </div>
                <div class="flex items-center justify-between">
                  <span class="font-mono text-slate-500 font-bold">🔒 ${ev.password}</span>
                  <button onclick="copyText('${ev.password}')" class="text-emerald-600 hover:text-emerald-700 font-bold text-[11px]">複製密碼</button>
                </div>
              </div>

              <div class="pt-1">
                <a href="${ev.ticketLink}" target="_blank" rel="noopener" class="text-blue-500 hover:underline truncate block text-[11px]"><i class="fas fa-link mr-1"></i>${ev.ticketLink}</a>
              </div>
            </div>
          </div>

          ${actionButtonsHtml}
        `;
        listContainer.appendChild(card);
      });
    }

    async function fetchSheetRecords() {
      document.getElementById('loadingRecords').classList.remove('hidden');
      document.getElementById('recordsCardList').innerHTML = '';

      try {
        const resp = await fetch(`${GAS_WEB_APP_URL}?action=get_all_records`);
        const data = await resp.json();
        sheetRecords = Array.isArray(data.records) ? data.records : [];
        if (Array.isArray(data.platforms) && data.platforms.length > 0) {
          renderPlatformDatalist(data.platforms);
        }
        document.getElementById('loadingRecords').classList.add('hidden');
        renderRecordsList();
      } catch (e) {
        document.getElementById('loadingRecords').innerHTML = "載入戰績失敗，請重新載入。";
      }
    }

    function renderRecordsList() {
      const search = document.getElementById('recordSearchInput').value.toLowerCase().trim();
      const sortSelect = document.getElementById('recordSortSelect').value;
      const listContainer = document.getElementById('recordsCardList');
      listContainer.innerHTML = '';

      const filtered = sheetRecords.filter(r => {
        return (r.title || '').toLowerCase().includes(search) ||
               (r.platform || '').toLowerCase().includes(search) ||
               (r.saleDate || '').toLowerCase().includes(search) ||
               (r.countTag || '').toLowerCase().includes(search);
      });

      filtered.sort((a, b) => {
        const d1 = (a.saleDate || '').replace(/[\/\-]/g, '.');
        const d2 = (b.saleDate || '').replace(/[\/\-]/g, '.');
        return sortSelect === 'desc' ? d2.localeCompare(d1) : d1.localeCompare(d2);
      });

      if (filtered.length === 0) {
        listContainer.innerHTML = `<div class="col-span-full text-center py-20 text-slate-400 font-bold">無符合戰績</div>`;
        return;
      }

      filtered.forEach((r) => {
        const card = document.createElement('div');
        card.className = "bg-white rounded-2xl border border-slate-200 p-5 shadow-sm flex flex-col justify-between";

        const tagsHtml = (r.countTag || '').split(' ').filter(t => t.trim()).map(t =>
          `<span class="px-2 py-0.5 rounded-lg bg-emerald-50 text-emerald-700 font-bold text-[11px] border border-emerald-100">${t}</span>`
        ).join(' ');

        const imgPreview = r.imageUrl
          ? `<a href="${r.imageUrl}" target="_blank" class="block mt-2"><img src="${r.imageUrl}" class="w-full h-32 object-cover rounded-xl border border-slate-100"></a>`
          : '';

        card.innerHTML = `
          <div>
            <div class="flex items-center justify-between pb-2 border-b border-slate-100">
              <span class="text-xs font-black text-emerald-600">${r.saleDate}</span>
              <span class="text-[11px] font-bold text-slate-400">${r.platform}</span>
            </div>
            <h4 class="text-sm font-black text-slate-900 mt-2.5 leading-snug line-clamp-2">${r.title}</h4>
            <div class="mt-3 flex flex-wrap gap-1.5">${tagsHtml}</div>
            ${imgPreview}
          </div>

          <div class="mt-4 pt-3 border-t border-slate-100 flex gap-2">
            <button onclick='openEditRecordModal(${JSON.stringify(r)})' class="flex-1 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-xs transition">
              ✏️ 編輯
            </button>
            <button onclick="deleteRecordItem(${r.rowIndex})" class="py-2 px-3 rounded-xl bg-rose-50 hover:bg-rose-100 text-rose-600 font-bold text-xs transition border border-rose-200">
              🗑️ 刪除
            </button>
          </div>
        `;
        listContainer.appendChild(card);
      });
    }

    function openEditRecordModal(r) {
      document.getElementById('editRecordRowIndex').value = r.rowIndex;
      document.getElementById('editRecordDate').value = r.saleDate;
      document.getElementById('editRecordTitle').value = r.title;
      document.getElementById('editRecordPlatform').value = r.platform;
      document.getElementById('editRecordCount').value = r.countTag;
      document.getElementById('editRecordImage').value = r.imageUrl || '';
      editBase64 = '';
      document.getElementById('editFileInput').value = '';

      if (r.imageUrl) {
        document.getElementById('editPreview').src = r.imageUrl;
        document.getElementById('editDropPrompt').classList.add('hidden');
        document.getElementById('editPreviewContainer').classList.remove('hidden');
      } else {
        document.getElementById('editPreview').src = '';
        document.getElementById('editDropPrompt').classList.remove('hidden');
        document.getElementById('editPreviewContainer').classList.add('hidden');
      }

      document.getElementById('editRecordModal').classList.add('active');
    }

    function closeEditRecordModal() {
      document.getElementById('editRecordModal').classList.remove('active');
    }

    async function confirmUpdateRecord() {
      const rowIndex = document.getElementById('editRecordRowIndex').value;
      const saleDate = document.getElementById('editRecordDate').value.trim();
      const title = document.getElementById('editRecordTitle').value.trim();
      const platform = document.getElementById('editRecordPlatform').value.trim();
      const countTag = document.getElementById('editRecordCount').value.trim();
      const imageUrl = document.getElementById('editRecordImage').value.trim();

      if (!title || !saleDate || !platform || !countTag) {
        return alert("請填寫所有必填欄位！");
      }

      const btn = document.getElementById('btnEditRecordConfirm');
      btn.disabled = true;
      btn.innerText = "更新中...";

      try {
        await fetch(GAS_WEB_APP_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({
            action: "update_record",
            rowIndex: rowIndex,
            saleDate: saleDate,
            title: title,
            platform: platform,
            countTag: countTag,
            imageUrl: imageUrl,
            imageBase64: editBase64
          })
        });

        alert("戰績修改成功！");
        closeEditRecordModal();
        setTimeout(fetchSheetRecords, 1200);
      } catch (e) {
        alert("修改失敗：" + e.message);
      } finally {
        btn.disabled = false;
        btn.innerText = "儲存變更";
      }
    }

    async function deleteRecordItem(rowIndex) {
      if (!confirm("確定要刪除這筆戰績紀錄嗎？試算表中的資料將會直接被刪除。")) return;

      try {
        await fetch(GAS_WEB_APP_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({
            action: "delete_record",
            rowIndex: rowIndex
          })
        });

        alert("刪除成功！");
        setTimeout(fetchSheetRecords, 1200);
      } catch (e) {
        alert("刪除失敗：" + e.message);
      }
    }

    function openPublishModal(idx) {
      const ev = adminEvents[idx];
      if (!ev) return;
      document.getElementById('modalEventId').value = ev.id;
      document.getElementById('modalDate').value = (ev.ticketDate || '').replace(/-/g, '.');
      document.getElementById('modalTitle').value = '';
      document.getElementById('modalPlatform').value = detectPlatformFromUrl(ev.ticketLink);
      document.getElementById('modalCount').value = buildFormattedCountTag(ev);
      document.getElementById('modalImage').value = '';
      modalBase64 = '';
      document.getElementById('modalFileInput').value = '';
      document.getElementById('modalPreview').src = '';
      document.getElementById('modalDropPrompt').classList.remove('hidden');
      document.getElementById('modalPreviewContainer').classList.add('hidden');
      document.getElementById('publishModal').classList.add('active');
    }

    function closePublishModal() {
      document.getElementById('publishModal').classList.remove('active');
    }

    async function confirmPublishAndSuccess() {
      const eventId = document.getElementById('modalEventId').value;
      const saleDate = document.getElementById('modalDate').value.trim();
      const title = document.getElementById('modalTitle').value.trim();
      const platform = document.getElementById('modalPlatform').value.trim();
      const countTag = document.getElementById('modalCount').value.trim();
      const imageUrl = document.getElementById('modalImage').value.trim();

      if (!title) return alert("請輸入節目名稱！");

      const btn = document.getElementById('btnModalConfirm');
      btn.disabled = true;
      btn.innerText = "處理中...";

      try {
        await fetch(GAS_WEB_APP_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({
            action: "publish_and_mark_success",
            eventId: eventId,
            saleDate: saleDate,
            title: title,
            platform: platform,
            countTag: countTag,
            imageUrl: imageUrl,
            imageBase64: modalBase64
          })
        });

        alert("已標記成功並插入至戰績試算表最上方！");
        closePublishModal();
        setTimeout(fetchAdminEvents, 1200);
      } catch (e) {
        alert("操作失敗：" + e.message);
      } finally {
        btn.disabled = false;
        btn.innerText = "確認發布";
      }
    }

    async function submitNewRecord() {
      const saleDate = document.getElementById('recDate').value.trim();
      const title = document.getElementById('recTitle').value.trim();
      const platform = document.getElementById('recPlatform').value.trim();
      const countTag = document.getElementById('recCount').value.trim();
      const imageUrl = document.getElementById('recImage').value.trim();

      if (!saleDate || !title || !countTag || !platform) {
        return alert("請填寫所有必填欄位！");
      }

      const btn = document.getElementById('btnSubmitRecord');
      btn.disabled = true;
      btn.innerText = "寫入中...";

      try {
        await fetch(GAS_WEB_APP_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({
            action: "add_record",
            saleDate: saleDate,
            title: title,
            platform: platform,
            countTag: countTag,
            imageUrl: imageUrl,
            imageBase64: recBase64
          })
        });

        alert("已成功插入至試算表最上方！");
        document.getElementById('recTitle').value = '';
        document.getElementById('recCount').value = '';
        document.getElementById('recImage').value = '';
        clearImage({ stopPropagation: () => {} }, 'rec');
        switchTab('records');
        setTimeout(fetchSheetRecords, 1200);
      } catch (e) {
        alert("寫入失敗：" + e.message);
      } finally {
        btn.disabled = false;
        btn.innerText = "➕ 新增戰績至試算表";
      }
    }

    async function updateEventStatus(eventId, status) {
      const promptText = status ? `確定要將此行程標記為【${status}】嗎？` : "確定要重設為【待處理】狀態嗎？";
      if (!confirm(promptText)) return;

      try {
        await fetch(GAS_WEB_APP_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({
            action: "update_status",
            eventId: eventId,
            status: status
          })
        });

        alert("更新指令已送出！");
        setTimeout(fetchAdminEvents, 1200);
      } catch (e) {
        alert("更新失敗：" + e.message);
      }
    }

    function copyText(text) {
      navigator.clipboard.writeText(text).then(() => {
        alert("已複製到剪貼簿！");
      });
    }
  </script>
</body>
