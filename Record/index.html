        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'Noto Sans TC', 'sans-serif'],
                        oswald: ['Oswald', 'sans-serif'],

                        'soft-blob': 'softBlob 15s infinite ease-in-out',

                    keyframes: {

    <style>

    <script>
        const csvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vThZZurHBpfes9J-dLaoi51jpb0MnQ4oABmBux77r-OO5LOvuoex6lesE4GvZb-UQ5zgiqWEfiHxNQy/pub?output=csv';
        const proxyUrl = 'https://api.allorigins.win/raw?url=';
        let allRecords = [], currentYear = 'all', currentMonth = 'all', currentPlatform = 'all';
        let KEY_DATE = '售票日期', KEY_TITLE = '節目名稱', KEY_COUNT = '張數', KEY_PLATFORM = '售票平台', KEY_IMAGE = '圖片';
        let isGridView = true;
        let debounceTimer = null;

        function init() { 
            fetchRecords(); 
            setupEventListeners();
            if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
                toggleTheme(true);
            }
        }

        async function fetchRecords() {
            document.getElementById('skeleton-container').classList.remove('hidden');
            document.getElementById('record-grid').classList.add('hidden');
            document.getElementById('no-results').classList.add('hidden');

            try {
                const targetUrl = window.location.protocol === 'file:' 
                    ? proxyUrl + encodeURIComponent(csvUrl) 
                    : csvUrl;

                const response = await fetch(targetUrl);
                if (!response.ok) throw new Error('網路連線回應錯誤');
                const csvText = await response.text();

                Papa.parse(csvText, {
                    header: true,
                    skipEmptyLines: true,
                    transformHeader: h => h.trim().replace(/^\uFEFF/, ''),
                    complete: function(results) {
                        if (results.data && results.data.length > 0) { 
                            const keys = Object.keys(results.data[0]); 
                            KEY_DATE = keys.find(k => k.includes('日期') || k.includes('時間')) || KEY_DATE; 
                            KEY_TITLE = keys.find(k => k.includes('節目') || k.includes('名稱') || k.includes('活動')) || KEY_TITLE; 
                            KEY_COUNT = keys.find(k => k.includes('張數') || k.includes('數量')) || KEY_COUNT;
                            KEY_PLATFORM = keys.find(k => k.includes('平台') || k.includes('售票')) || KEY_PLATFORM;
                            KEY_IMAGE = keys.find(k => k.includes('圖片') || k.includes('截圖') || k.includes('戰報') || k.toLowerCase().includes('proof') || k.toLowerCase().includes('image')) || '圖片';
                        }
                        allRecords = results.data.filter(item => item[KEY_TITLE] && item[KEY_TITLE].trim() !== '');
                        populateYears(); 
                        populatePlatforms();
                        updateDashboard();
                    }
                });
            } catch (err) {
                console.error("載入失敗：", err);
                document.getElementById('skeleton-container').classList.add('hidden');
                document.getElementById('no-results').classList.remove('hidden');
            }
        }

        function toggleTheme(forceDark) {
            const html = document.documentElement;
            const btn = document.getElementById('theme-toggle');
            const span = btn.querySelector('span');
            const icon = btn.querySelector('i');
            
            if (forceDark || !html.classList.contains('dark')) {
                html.classList.add('dark');
                icon.className = 'fas fa-sun';
                span.textContent = '淺色模式';
            } else {
                html.classList.remove('dark');
                icon.className = 'fas fa-moon';
                span.textContent = '深色模式';
            }
        }

        function toggleLayout() {
            isGridView = !isGridView;
            const btn = document.getElementById('layout-toggle');
            const span = btn.querySelector('span');
            const icon = btn.querySelector('i');
            
            if (isGridView) {
                icon.className = 'fas fa-th-large';
                span.textContent = '列表佈局';
            } else {
                icon.className = 'fas fa-list';
                span.textContent = '網格佈局';
            }
            updateDashboard();
        }

        function setupEventListeners() {
            document.getElementById('theme-toggle').onclick = () => toggleTheme();
            document.getElementById('layout-toggle').onclick = toggleLayout;

            document.getElementById('searchInput').addEventListener('input', () => {
                clearTimeout(debounceTimer);
                debounceTimer = setTimeout(updateDashboard, 200);
            });

            document.getElementById('sortSelect').addEventListener('change', updateDashboard);
            
            const yearFilter = document.getElementById('year-filter'), 
                  monthFilter = document.getElementById('month-filter'),
                  platformFilter = document.getElementById('platform-filter');

            yearFilter.addEventListener('change', (e) => { 
                currentYear = e.target.value; 
                populateMonthsForYear(currentYear);
                updateDashboard(); 
            });

            monthFilter.addEventListener('change', (e) => { 
                currentMonth = e.target.value; 
                updateDashboard(); 
            });

            platformFilter.addEventListener('change', (e) => { 
                currentPlatform = e.target.value; 
                updateDashboard(); 
            });

            document.getElementById('reset-btn').onclick = () => { 
                document.getElementById('searchInput').value = ''; 
                document.getElementById('sortSelect').value = 'desc'; 
                yearFilter.value = 'all'; 
                monthFilter.value = 'all'; 
                platformFilter.value = 'all'; 
                monthFilter.disabled = true; 
                monthFilter.innerHTML = '<option value="all">月份</option>';
                currentYear = 'all'; 
                currentMonth = 'all'; 
                currentPlatform = 'all'; 
                updateDashboard(); 
            };

            document.getElementById('reload-btn').onclick = fetchRecords;
            window.onscroll = () => { document.getElementById('back-to-top').style.display = window.scrollY > 400 ? 'flex' : 'none'; };
            document.getElementById('back-to-top').onclick = () => window.scrollTo({top: 0, behavior: 'smooth'});
        }

        function parseParts(dStr) {
            if (!dStr) return { y: '', m: '', d: '' };
            const parts = dStr.replace(/[\/\-]/g, '.').split('.');
            return {
                y: parts[0] || '',
                m: parts[1] ? String(parts[1]).padStart(2, '0') : '',
                d: parts[2] ? String(parts[2]).padStart(2, '0') : ''
            };
        }

        function populateYears() {
            const years = [...new Set(allRecords.map(item => parseParts(item[KEY_DATE]).y))].filter(y => y && y.length === 4).sort().reverse();
            document.getElementById('year-filter').innerHTML = '<option value="all">年份</option>' + years.map(y => `<option value="${y}">${y} 年</option>`).join('');
        }

        function populateMonthsForYear(selectedYear) {
            const monthFilter = document.getElementById('month-filter');
            if (selectedYear === 'all') {
                monthFilter.disabled = true;
                monthFilter.innerHTML = '<option value="all">月份</option>';
                currentMonth = 'all';
                return;
            }

            const availableMonths = [...new Set(
                allRecords
                    .filter(item => parseParts(item[KEY_DATE]).y === selectedYear)
                    .map(item => parseParts(item[KEY_DATE]).m)
            )].filter(m => m).sort();

            monthFilter.disabled = false;
            monthFilter.innerHTML = '<option value="all">全月份</option>' + 
                availableMonths.map(m => `<option value="${m}">${m}月</option>`).join('');
            currentMonth = 'all';
        }

        function populatePlatforms() {
            const platforms = [...new Set(allRecords.map(item => (item[KEY_PLATFORM] || '').trim()))].filter(p => p !== '');
            document.getElementById('platform-filter').innerHTML = '<option value="all">所有平台</option>' + platforms.map(p => `<option value="${p}">${p}</option>`).join('');
        }

        function getTicketStatusBadge(rawDate) {
            if (!rawDate) return '';
            const { y, m, d } = parseParts(rawDate);
            if (!y || !m || !d) return '';

            const recordTime = new Date(`${y}-${m}-${d}T00:00:00`).getTime();
            if (isNaN(recordTime)) return '';

            const now = new Date();
            const todayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
            const diffDays = Math.round((todayStart - recordTime) / (1000 * 60 * 60 * 24));

            if (diffDays >= 0 && diffDays <= 7) {
                return `<span class="bg-red-50 dark:bg-red-950/40 text-red-600 dark:text-red-400 px-2.5 py-1 rounded-lg text-[11px] font-black flex items-center border border-red-200 dark:border-red-800 shadow-sm"><i class="fas fa-fire mr-1 text-red-500"></i>最新戰績</span>`;
            } else if (diffDays > 7 && y === String(now.getFullYear()) && m === String(now.getMonth() + 1).padStart(2, '0')) {
                return `<span class="bg-emerald-50 dark:bg-emerald-950/40 text-emerald-600 dark:text-emerald-400 px-2.5 py-1 rounded-lg text-[11px] font-black flex items-center border border-emerald-200 dark:border-emerald-800 shadow-sm"><i class="fas fa-sparkles mr-1 text-emerald-500"></i>本月戰果</span>`;
            }
            return '';
        }

        function openProofModal(imgUrl, title) {
            document.getElementById('proofModalImg').src = imgUrl;
            document.getElementById('proofModalTitle').innerText = title || '戰報截圖';
            document.getElementById('proofModal').classList.add('active');
        }

        function closeProofModal() {
            document.getElementById('proofModal').classList.remove('active');
            document.getElementById('proofModalImg').src = '';
        }

        function updateDashboard() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase().trim(), 
                  sortOrder = document.getElementById('sortSelect').value;

            let filtered = allRecords.filter(item => { 
                const rawDate = item[KEY_DATE] || '';
                const { y, m } = parseParts(rawDate);
                const platformVal = (item[KEY_PLATFORM] || '').trim();
                const titleMatch = (item[KEY_TITLE] || '').toLowerCase().includes(searchTerm); 
                const dateMatch = rawDate.includes(searchTerm); 
                const yearMatch = currentYear === 'all' || y === currentYear; 
                const monthMatch = currentMonth === 'all' || m === currentMonth; 
                const platformMatch = currentPlatform === 'all' || platformVal === currentPlatform; 
                return (titleMatch || dateMatch) && yearMatch && monthMatch && platformMatch; 
            });

            filtered.sort((a, b) => { 
                const d1 = a[KEY_DATE] || '', d2 = b[KEY_DATE] || ''; 
                return sortOrder === 'desc' ? d2.localeCompare(d1) : d1.localeCompare(d2); 
            });

            renderUI(filtered);
        }

        function renderUI(data) {
            const grid = document.getElementById('record-grid'), 
                  noResults = document.getElementById('no-results'),
                  skeleton = document.getElementById('skeleton-container');
            
            skeleton.classList.add('hidden');
            grid.innerHTML = ''; 
            
            if (isGridView) {
                grid.classList.remove('lg:grid-cols-1');
                grid.classList.add('lg:grid-cols-2');
            } else {
                grid.classList.remove('lg:grid-cols-2');
                grid.classList.add('lg:grid-cols-1');
            }

            if (data.length === 0) { 
                grid.classList.add('hidden'); 
                noResults.classList.remove('hidden'); 
            } else {
                noResults.classList.add('hidden'); 
                grid.classList.remove('hidden');

                data.forEach((item, index) => {
                    const card = document.createElement('div'); 
                    card.className = `ticket-card rounded-2xl flex flex-col h-full animate-fade-in-up overflow-hidden`; 
                    card.style.animationDelay = `${Math.min(index * 20, 300)}ms`;

                    const { y, m, d } = parseParts(item[KEY_DATE]);
                    const monthNames = ["JAN", "FEB", "MAR", "APR", "MAY", "JUN", "JUL", "AUG", "SEP", "OCT", "NOV", "DEC"]; 
                    const mIdx = parseInt(m, 10) - 1;
                    const mStr = (mIdx >= 0 && mIdx < 12) ? monthNames[mIdx] : '---';

                    const statusBadge = getTicketStatusBadge(item[KEY_DATE]);

                    const tags = (item[KEY_COUNT] || '').split(' ').filter(t => t.trim()).map(tag => 
                        `<span class="bg-emerald-50 dark:bg-emerald-900/20 text-emerald-600 dark:text-emerald-400 px-3 py-1.5 rounded-lg text-[11px] font-black flex items-center border border-emerald-100 dark:border-emerald-800 shadow-sm"><i class="fas fa-ticket-alt mr-2 opacity-60"></i>${tag}</span>`
                    ).join('');
                    
                    const platformTag = item[KEY_PLATFORM] ? `<span class="text-[9px] font-bold text-slate-400 dark:text-slate-500 uppercase tracking-widest mt-2 block">${item[KEY_PLATFORM]}</span>` : '';

                    const imgUrl = (item[KEY_IMAGE] || '').trim();
                    const proofBtn = imgUrl ? `
                        <button onclick="openProofModal('${encodeURI(imgUrl)}', '${item[KEY_TITLE].replace(/'/g, "\\'")}')" class="ml-auto bg-slate-100 dark:bg-slate-800 hover:bg-emerald-50 dark:hover:bg-emerald-900/30 text-slate-600 dark:text-slate-300 hover:text-emerald-600 px-2.5 py-1.5 rounded-lg text-[11px] font-bold flex items-center gap-1.5 border border-slate-200 dark:border-slate-700 transition">
                            <i class="fas fa-camera text-xs text-emerald-500"></i>
                            <span>查看截圖</span>
                        </button>
                    ` : '';

                    card.innerHTML = `
                        <div class="flex-1 flex flex-col">
                            <div class="flex items-stretch gap-0 h-full">
                                <div class="ticket-stub flex flex-col items-center justify-center p-5 min-w-[90px] md:min-w-[100px] text-center">
                                    <span class="text-[10px] font-black tracking-widest text-emerald-500 uppercase">${mStr}</span>
                                    <span class="text-3xl md:text-4xl font-black font-oswald text-slate-900 dark:text-white my-1">${d || '--'}</span>
                                    <span class="text-[10px] font-bold text-slate-400 dark:text-slate-500 opacity-80">${y || '----'}</span>
                                </div>
                                <div class="p-5 md:p-6 flex-1 flex flex-col justify-center">
                                    <h3 class="text-sm md:text-lg font-black text-slate-800 dark:text-slate-100 leading-snug line-clamp-3">${item[KEY_TITLE]}</h3>
                                    ${platformTag}
                                </div>
                            </div>
                        </div>
                        <div class="ticket-dashed-line mx-8"></div>
                        <div class="p-5 bg-gray-50/50 dark:bg-slate-900/30 flex flex-wrap items-center gap-2.5">
                            ${statusBadge}
                            ${tags}
                            ${proofBtn}
                        </div>
                    `;
                    grid.appendChild(card);
                });
            }
        }
        init();
    </script>
</body>
</html>
